[package]
name = "waf-ai-proto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

# 判定代码拆成 lib：门禁程序（bin）与采集代理（proxy/）共用同一份，
# 避免"复制一份判定逻辑"导致两侧漂移、门禁失去意义。
[lib]
name = "waf_ai_proto"
path = "src/lib.rs"

[[bin]]
name = "waf-ai-proto"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ndarray = "0.17.2"
ort = "2.0.0-rc.14"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
